<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>[IL] DarkRP Israel - Loading</title>
<style>
  :root { --orange:#ff961e; --navy:#141826; --panel:rgba(16,20,34,.82); --text:#eef0f6; --muted:#9aa2bd; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e18; color:var(--text);
              font-family:"Segoe UI",Arial,Tahoma,sans-serif; }
  .bg { position:fixed; inset:0; background:url("bg.jpg") center/cover no-repeat;
        animation:zoom 40s ease-in-out infinite alternate; }
  @keyframes zoom { from { transform:scale(1); } to { transform:scale(1.07); } }
  .shade { position:fixed; inset:0;
           background:linear-gradient(to top, rgba(8,10,18,.95) 0%, rgba(8,10,18,.35) 32%, rgba(8,10,18,0) 55%); }

  .bottom { position:fixed; left:40px; right:520px; bottom:34px; display:flex; gap:24px; align-items:flex-end; }

  .status { flex:1; display:flex; gap:20px; align-items:center; background:var(--panel);
            border-top:3px solid var(--orange); border-radius:12px; padding:18px 22px; }
  .status img { width:92px; height:92px; border-radius:10px; flex-shrink:0; }
  .status .info { flex:1; min-width:0; }
  .server { font-size:24px; font-weight:800; }
  .server span { color:var(--orange); }
  .meta { color:var(--muted); font-size:15px; margin-top:2px; }
  .bar { height:12px; background:#262c44; border-radius:6px; overflow:hidden; margin-top:12px; }
  .fill { height:100%; width:0%; background:linear-gradient(90deg,#ff7a00,var(--orange),#ffc070);
          border-radius:6px; transition:width .4s ease; }
  .msg { margin-top:8px; font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .tips { position:fixed; top:34px; right:40px; width:430px; direction:rtl; text-align:right; background:var(--panel);
          border-top:3px solid var(--orange); border-radius:12px; padding:16px 22px; min-height:128px; }
  .tips h3 { color:var(--orange); font-size:16px; letter-spacing:.5px; margin-bottom:8px; }
  .tip { font-size:17px; line-height:1.55; transition:opacity .5s; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="shade"></div>

  <div class="bottom">
    <div class="status">
      <img src="logo.jpg" alt="">
      <div class="info">
        <div class="server" id="server"><span>[IL]</span> DarkRP Israel | Fun RP</div>
        <div class="meta" id="meta">Connecting...</div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="msg" id="msg">Starting...</div>
      </div>
    </div>

  </div>

  <div class="tips">
    <h3>💡 טיפ</h3>
    <div class="tip" id="tip"></div>
  </div>

<script>
  var TIPS = [
    "קנה רכב אצל סוכן הרכבים - הוא נשמר לך במוסך לתמיד.",
    "אין לך רכב? חפש עמדת מונית - נסיעה עולה רק $50-$100.",
    "רוצה מקום משלך? שכור חדר במלון אצל פקידת הקבלה.",
    "פושעים יכולים לשדוד את כספת הבנק - אבל המצלמות רואות הכל.",
    "שוטרים ומאבטחים: כתבו !cameras כדי לצפות במצלמות הבנק.",
    "עבודות משטרה ושירותים מקבלות רכב עבודה במוסך העבודה.",
    "כתוב !rules בכל רגע כדי לקרוא את חוקי השרת.",
    "מתת? NLR - אסור לחזור למקום המוות במשך 3 דקות.",
    "לחץ F4 כדי לבחור עבודה. עבודות המנהלים הן ל-VIP.",
    "שק כסף על הגב מאט אותך - תביא אותו לנקודת המסירה מהר!"
  ];
  var t = Math.floor(Math.random() * TIPS.length), tipEl = document.getElementById("tip");
  function nextTip() {
    tipEl.style.opacity = 0;
    setTimeout(function () { tipEl.textContent = TIPS[t]; tipEl.style.opacity = 1; t = (t + 1) % TIPS.length; }, 400);
  }
  nextTip(); setInterval(nextTip, 7000);

  // ---- Garry's Mod loading callbacks
  var total = 0, needed = 0;
  function setFill() {
    if (total > 0) document.getElementById("fill").style.width = Math.max(3, Math.round((total - needed) / total * 100)) + "%";
  }
  function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    document.getElementById("meta").textContent = "Map: " + mapname + "   |   Slots: " + maxplayers;
  }
  function SetFilesTotal(n) { total = n; needed = n; setFill(); }
  function SetFilesNeeded(n) { needed = n; setFill(); }
  function DownloadingFile(name) {
    needed = Math.max(0, needed - 1); setFill();
    document.getElementById("msg").textContent = "Downloading: " + name.split("/").pop();
  }
  function SetStatusChanged(status) {
    document.getElementById("msg").textContent = status;
    if (/Sending client info|Client info sent|Starting Lua/i.test(status)) document.getElementById("fill").style.width = "100%";
  }
</script>
</body>
</html>
